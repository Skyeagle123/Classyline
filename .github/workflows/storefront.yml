name: Storefront validation
on:
  push:
    branches: [phase/storefront-cod-whatsapp, phase/admin-r2-image-upload]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run security:check
      - run: npm run build
      - run: npm run build:functions
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm audit --audit-level=high
