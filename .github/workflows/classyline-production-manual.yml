name: ClassyLine reviewed Production upload

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed application commit
        required: true
        type: string
      expected_production_deployment:
        description: Current Production deployment ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: classyline2-reviewed-production-upload
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor == 'Skyeagle123' &&
      github.triggering_actor == 'Skyeagle123'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: classyline-production
    env:
      APPROVED_SHA: b64e078ee6ecfc5f4e124fe6d68129164f521b8a
      APPROVED_TREE: 123889f9fd27b3f0b2138ea057efa2e762a231b1
      APPROVED_CI_RUN: '39297195087'
      PRODUCTION_SOURCE: 393ff88e76dcca226de7f83e148554699e85ca01
      PRODUCTION_DEPLOYMENT: 5824179f-af77-4a18-9a23-ab22019e8ccc
      CLOUDFLARE_EXPECTED_ACCOUNT: 4bfa1a9c849c3da50520f7a4bcccccab
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require explicit release intent and installed environment
        env:
          RELEASE_ARMED: ${{ vars.CLASSYLINE_RELEASE_ARMED }}
          INPUT_SHA: ${{ inputs.approved_sha }}
          INPUT_DEPLOYMENT: ${{ inputs.expected_production_deployment }}
        run: |
          set -euo pipefail
          test "$RELEASE_ARMED" = true
          test "$INPUT_SHA" = "$APPROVED_SHA"
          test "$INPUT_DEPLOYMENT" = "$PRODUCTION_DEPLOYMENT"

      - name: Verify workflow ref, single dispatch and accepted CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          base = 'https://api.github.com/repos/Skyeagle123/Classyline'
          def get(path):
              req = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.load(response)

          def require(ok, label):
              if not ok:
                  raise SystemExit('Release gate failed: ' + label)

          require(get('/branches/main')['commit']['sha'] == os.environ['GITHUB_SHA'], 'workflow branch drift')
          runs = get('/actions/workflows/classyline-production-manual.yml/runs?event=workflow_dispatch&per_page=100')
          require(runs['total_count'] == 1 and len(runs['workflow_runs']) == 1 and
                  runs['workflow_runs'][0]['id'] == int(os.environ['GITHUB_RUN_ID']),
                  'release already attempted or run identity changed')
          ci = get('/actions/runs/' + os.environ['APPROVED_CI_RUN'])
          require(ci['head_sha'] == os.environ['APPROVED_SHA'] and
                  ci['head_commit']['tree_id'] == os.environ['APPROVED_TREE'] and
                  ci['event'] == 'push' and ci['run_attempt'] == 1 and
                  ci['status'] == 'completed' and ci['conclusion'] == 'success',
                  'approved source CI')
          print('First dispatch, current main and exact approved CI verified')
          PY

      - uses: actions/checkout@v4
        with:
          ref: b64e078ee6ecfc5f4e124fe6d68129164f521b8a
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact application checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$APPROVED_TREE"
          test -z "$(git status --porcelain=v1)"
          test -z "$(find . -maxdepth 1 -type f -name 'wrangler.*' -print)"

      - name: Revalidate the reviewed application
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run security:check
          npm run build
          npm run build:functions
          npm audit --audit-level=high
          test -f 'functions/api/[[path]].js'
          test -f dist/_routes.json
          test -f /tmp/classyline-functions-build/index.js
          test -z "$(git status --porcelain=v1)"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum
          sha256sum /tmp/classyline-functions-build/index.js

      - name: Verify current Production and retained rollback deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          def require(ok, label):
              if not ok:
                  raise SystemExit('Production gate failed: ' + label)

          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          require(account == os.environ['CLOUDFLARE_EXPECTED_ACCOUNT'] and bool(token), 'credential configuration')
          base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/classyline2'
          def get(path):
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + token})
              with urllib.request.urlopen(req, timeout=15) as response:
                  body = json.load(response)
              require(body.get('success') is True and isinstance(body.get('result'), dict), 'API response')
              return body['result']

          project = get('')
          require(project.get('name') == 'classyline2' and project.get('production_branch') == 'main', 'project identity')
          source = project.get('source') or {}
          config = source.get('config') or {}
          require(source.get('type') == 'github' and config.get('owner') == 'Skyeagle123' and
                  config.get('repo_name') == 'Classyline' and
                  config.get('production_deployments_enabled') is False,
                  'Git integration must not deploy main automatically')
          live = project.get('canonical_deployment') or {}
          require(live.get('id') == os.environ['PRODUCTION_DEPLOYMENT'] and
                  live.get('environment') == 'production' and
                  (live.get('deployment_trigger') or {}).get('metadata', {}).get('commit_hash') == os.environ['PRODUCTION_SOURCE'],
                  'Production baseline changed')
          prod = (project.get('deployment_configs') or {}).get('production') or {}
          require((prod.get('d1_databases') or {}).get('DB', {}).get('id') == '10c800b1-ddf7-427b-8354-9cf8529782b6' and
                  (prod.get('r2_buckets') or {}).get('PRODUCT_IMAGES', {}).get('name') == 'classyline-storefront-production-images' and
                  str(prod.get('compatibility_date', '')).split('T')[0] == '2025-11-13' and
                  prod.get('compatibility_flags') == [], 'Production bindings or compatibility changed')
          retained = get('/deployments/' + os.environ['PRODUCTION_DEPLOYMENT'])
          require(retained.get('id') == live['id'] and retained.get('environment') == 'production', 'rollback deployment unavailable')
          print('Exact Production source, deployment, bindings and rollback identity verified')
          PY

      - name: Upload exact reviewed application once
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain=v1)"
          npx --no-install wrangler pages deploy dist \
            --project-name classyline2 --branch main \
            --commit-hash "$APPROVED_SHA" --commit-dirty=false
          # An uncertain response requires manual deployment-history inspection.
          # No automatic retry, rollback, data migration or second upload occurs here.
