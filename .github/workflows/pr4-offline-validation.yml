name: PR4 offline safety validation
on:
  push:
    branches:
      - phase/manual-production-deployment-preparation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: node --check ops/pages-direct-upload.mjs && node --check ops/pages-artifact-regression.test.mjs
      - run: node --test ops/pages-artifact-regression.test.mjs ops/pages-direct-upload.test.mjs ops/production-workflow.test.mjs ops/direct-upload-design.test.mjs
