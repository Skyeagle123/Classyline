name: V2.1 release controller offline safety validation
on:
  push:
    branches: [phase/storefront-v21-production-release, phase/storefront-v21-activation]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/classyline-production-v21.yml
      - .github/workflows/v21-release-offline.yml
      - ops/v21-production-workflow.test.mjs
      - ops/fixtures/v21-release-api.mjs
      - ops/fixtures/v21-release-runtime.mjs
      - docs/v21-production-release.md
permissions:
  contents: read
jobs:
  offline:
    if: >-
      github.repository == 'Skyeagle123/Classyline' &&
      (github.ref == 'refs/heads/phase/storefront-v21-production-release' ||
       github.ref == 'refs/heads/phase/storefront-v21-activation' ||
       (github.event_name == 'pull_request' &&
        (github.head_ref == 'phase/storefront-v21-production-release' ||
         github.head_ref == 'phase/storefront-v21-activation')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CLASSYLINE_VALIDATION_TOOLS: ${{ github.workspace }}/classyline-validation-tools
    steps:
      - name: Check out the exact test candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up reviewed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install isolated locked syntax validator only
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Skyeagle123/Classyline
          test "$(node --version)" = v24.19.0
          mkdir -p "$CLASSYLINE_VALIDATION_TOOLS"
          cp ops/offline-validation/package.json ops/offline-validation/package-lock.json "$CLASSYLINE_VALIDATION_TOOLS/"
          npm ci --prefix "$CLASSYLINE_VALIDATION_TOOLS" --ignore-scripts --no-audit --no-fund
      - name: Validate YAML Bash and JavaScript without execution
        run: node ops/validate-offline-workflows.mjs
      - name: Run all offline release safety tests
        run: node --test ops/*.test.mjs
