name: Controlled ClassyLine V2.1 Production deployment
run-name: V2.1 code release 0ce95a7 by @${{ github.actor }}

# Release execution requires separate Owner approval and an explicitly armed window.
# Owner policy: one workflow execution / one pages deploy invocation; Wrangler's
# internal UNKNOWN_ERROR retries are accepted. This is NOT a single-HTTP-POST guarantee.
# Installation is NOT deployment authorization. See docs/production-deployment.md.
# Before installation, separately disable automatic Production builds, drain
# pending builds and verify the baseline. Configure the environment:
# owner-only required reviewer, main-only deployment branch, no admin bypass,
# CLOUDFLARE_API_TOKEN as an ENVIRONMENT secret (never a repository secret).
# Activation proposal only: unpublished and unapproved for installation or execution.
# This new fixed V2.1 workflow permits only its first dispatch and preserves all three V2 runs.
# Keep environment variable CLASSYLINE_RELEASE_ARMED absent/false until the
# Owner approves the exact installed workflow and release window.
# Freeze main pushes/merges and all other deployment operators for the run.
# Concurrency below cannot lock Cloudflare Git builds or other repositories.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: classyline2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Skyeagle123/Classyline' &&
      github.repository_id == '1096008352' &&
      github.repository_owner_id == '125151458' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Skyeagle123' &&
      github.actor_id == '125151458' &&
      github.triggering_actor == 'Skyeagle123' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: classyline-production
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 4bfa1a9c849c3da50520f7a4bcccccab

    steps:
      - name: Require separately armed release window
        env:
          RELEASE_ARMED: ${{ vars.CLASSYLINE_RELEASE_ARMED }}
        run: |
          test "$RELEASE_ARMED" = true

      - name: Verify approved CI and dispatch identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARMED: ${{ vars.CLASSYLINE_RELEASE_ARMED }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const e = process.env;
          assert.equal(e.GITHUB_REPOSITORY, 'Skyeagle123/Classyline');
          assert.equal(e.GITHUB_REPOSITORY_ID, '1096008352');
          assert.equal(e.GITHUB_REPOSITORY_OWNER_ID, '125151458');
          assert.equal(e.GITHUB_REF, 'refs/heads/main');
          assert.equal(e.GITHUB_EVENT_NAME, 'workflow_dispatch');
          assert.equal(e.GITHUB_ACTOR, 'Skyeagle123');
          assert.equal(e.GITHUB_ACTOR_ID, '125151458');
          assert.equal(e.GITHUB_TRIGGERING_ACTOR, 'Skyeagle123');
          assert.equal(e.GITHUB_RUN_ATTEMPT, '1');
          const base = 'https://api.github.com/repos/Skyeagle123/Classyline';
          async function get(path) {
            const r = await fetch(base + path, {redirect: 'error',
              headers: {Authorization: `Bearer ${e.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'}, signal: AbortSignal.timeout(20000)});
            if (!r.ok) throw new Error(`GitHub read failed: HTTP ${r.status}`);
            return r.json();
          }
          // BEGIN FIXED V21 GUARD — identical at initial and final preflight.
          async function verifyV21(get) {
            const e = process.env;
            const path = '.github/workflows/classyline-production-v21.yml';
            const historicalPath = '.github/workflows/classyline-production-manual.yml';
            const owner = 'Skyeagle123', ownerID = 125151458, workflowID = 391522489;
            const failedSHA = 'cddb2e8303df17b78d1880e73f311547ea333dc0';
            const failedTree = 'c5d0d4ba5281660d00c5924511d0639885a3d875';
            assert.equal(e.GITHUB_RUN_ATTEMPT, '1');
            assert.equal(e.GITHUB_RUN_NUMBER, '1', 'V2.1 release opportunity consumed');
            assert.equal(e.RELEASE_ARMED, 'true', 'Release window is not armed');
            for (const [key, value] of Object.entries({GITHUB_REPOSITORY:'Skyeagle123/Classyline',
              GITHUB_REPOSITORY_ID:'1096008352', GITHUB_REPOSITORY_OWNER_ID:'125151458',
              GITHUB_REF:'refs/heads/main', GITHUB_EVENT_NAME:'workflow_dispatch',
              GITHUB_ACTOR:'Skyeagle123', GITHUB_ACTOR_ID:'125151458', GITHUB_TRIGGERING_ACTOR:'Skyeagle123'}))
              assert.equal(e[key], value, 'Unauthorized V2.1 release identity');
            assert.match(e.GITHUB_SHA, /^[a-f0-9]{40}$/);
            assert.equal(e.GITHUB_WORKFLOW_SHA, e.GITHUB_SHA, 'Controller execution identity mismatch');
            assert.equal(e.GITHUB_WORKFLOW_REF, `Skyeagle123/Classyline/${path}@refs/heads/main`);
            const currentID = Number(e.GITHUB_RUN_ID);
            assert(Number.isSafeInteger(currentID) && currentID > 39838839195);
            const inventory = await get('/actions/workflows/classyline-production-manual.yml/runs' +
              '?event=workflow_dispatch&per_page=100');
            assert.equal(inventory.total_count, 3, 'Unexpected dispatch inventory');
            assert(Array.isArray(inventory.workflow_runs));
            assert.equal(inventory.workflow_runs.length, 3, 'Incomplete dispatch inventory');
            const expectedIDs = [39629341749, 39814798811, 39838839195].sort((a,b) => a-b);
            assert.deepEqual(inventory.workflow_runs.map(r => r.id).sort((a,b) => a-b), expectedIDs,
              'Missing, duplicate or unexpected dispatch');
            function identity(r, id, number, sha, tree, status, conclusion, expectedPath = historicalPath, expectedWorkflow = workflowID) {
              assert.equal(r.id, id); assert.equal(r.workflow_id, expectedWorkflow);
              assert.equal(r.repository?.full_name, 'Skyeagle123/Classyline');
              assert.equal(r.repository?.id, 1096008352);
              assert.equal(r.path, expectedPath); assert.equal(r.event, 'workflow_dispatch');
              assert.equal(r.actor?.login, owner); assert.equal(r.actor?.id, ownerID);
              assert.equal(r.triggering_actor?.login, owner); assert.equal(r.triggering_actor?.id, ownerID);
              assert.equal(r.head_branch, 'main'); assert.equal(r.head_sha, sha);
              assert.equal(r.head_commit?.id, sha); assert.equal(r.head_commit?.tree_id, tree);
              assert.equal(r.run_number, number); assert.equal(r.run_attempt, 1);
              assert.equal(r.status, status); assert.equal(r.conclusion, conclusion);
            }
            const controller = await get('/git/commits/' + e.GITHUB_SHA);
            assert.equal(controller.sha, e.GITHUB_SHA);
            assert.match(controller.tree?.sha, /^[a-f0-9]{40}$/);
            // A reviewed activation squash from this exact installed baseline is required.
            assert.deepEqual(controller.parents?.map(p => p.sha), ['aaed520c284e533a9d2227107ce62b4be5579f50']);
            const expected = [
              [39629341749, 1, '492fb4a963f9a0c9a8a24cf783a47cbe44ae7586',
                '2632c6bd097c61af2eff1b48cefb186b1ad3802d', 'completed', 'success'],
              [39814798811, 2, failedSHA, failedTree, 'completed', 'failure'],
              [39838839195, 3, '583105d0c548caf9c81228f0d1f3572d9b6cbe37',
                '6b9139f265772078cb8d912ad9ad2a888c82d4bb', 'completed', 'success']
            ];
            for (const args of expected) {
              identity(inventory.workflow_runs.find(r => r.id === args[0]), ...args);
              identity(await get('/actions/runs/' + args[0]), ...args);
            }
            const workflow = await get('/actions/workflows/classyline-production-v21.yml');
            assert(Number.isSafeInteger(workflow.id) && workflow.id > 0 && workflow.id !== workflowID);
            assert.equal(workflow.path, path); assert.equal(workflow.state, 'active');
            const currentInventory = await get('/actions/workflows/classyline-production-v21.yml/runs?event=workflow_dispatch&per_page=100');
            assert.equal(currentInventory.total_count, 1, 'V2.1 dispatch opportunity consumed');
            assert(Array.isArray(currentInventory.workflow_runs));
            assert.equal(currentInventory.workflow_runs.length, 1, 'Incomplete V2.1 dispatch inventory');
            const currentArgs = [currentID, 1, e.GITHUB_SHA, controller.tree.sha, 'in_progress', null, path, workflow.id];
            identity(currentInventory.workflow_runs[0], ...currentArgs);
            identity(await get('/actions/runs/' + currentID), ...currentArgs);
            // Revalidate accepted CI and the exact source, tested merge and published squash.
            const ci = await get('/actions/runs/39851191294');
            assert.equal(ci.id, 39851191294); assert.equal(ci.repository?.full_name, 'Skyeagle123/Classyline');
            assert.equal(ci.repository?.id, 1096008352); assert.equal(ci.path, '.github/workflows/storefront.yml');
            assert.equal(ci.head_sha, '9ce02cce69d5774df46c7555543a7f95262c8507');
            assert.equal(ci.head_branch, 'phase/storefront-v21-whatsapp-swatches');
            assert.equal(ci.event, 'pull_request'); assert.equal(ci.run_attempt, 1);
            assert.equal(ci.status, 'completed'); assert.equal(ci.conclusion, 'success');
            assert.equal(ci.head_commit?.tree_id, '8266d7f79405fca39374298b4695687b225de4c7');
            const ciJobs = await get('/actions/runs/39851191294/attempts/1/jobs?per_page=100');
            assert.equal(ciJobs.total_count, 1); assert.equal(ciJobs.jobs?.length, 1);
            const ciJob = ciJobs.jobs[0];
            assert.equal(ciJob.run_id, 39851191294); assert.equal(ciJob.run_attempt, 1);
            assert.equal(ciJob.head_sha, ci.head_sha); assert.equal(ciJob.name, 'check');
            assert.equal(ciJob.status, 'completed'); assert.equal(ciJob.conclusion, 'success');
            const expectedCIsteps = ['Run npm ci --ignore-scripts','Run npm test','Run npm run security:check',
              'Run npm run build','Run npm run build:functions','Run npm audit --audit-level=high'];
            for (const name of expectedCIsteps) {
              const matches = ciJob.steps?.filter(s => s.name === name);
              assert.equal(matches?.length, 1); assert.equal(matches[0].status, 'completed');
              assert.equal(matches[0].conclusion, 'success');
            }
            const source = await get('/git/commits/9ce02cce69d5774df46c7555543a7f95262c8507');
            const tested = await get('/git/commits/4f1770c12451aed3495f66e3990e399016249ada');
            const squash = await get('/git/commits/0ce95a706a88c63a914c25b142d4fc6878de66d8');
            for (const [commit, sha] of [[source,ci.head_sha], [tested,'4f1770c12451aed3495f66e3990e399016249ada'],
              [squash,'0ce95a706a88c63a914c25b142d4fc6878de66d8']]) {
              assert.equal(commit.sha, sha); assert.equal(commit.tree?.sha, ci.head_commit.tree_id);
            }
            assert.deepEqual(source.parents?.map(p=>p.sha), ['583105d0c548caf9c81228f0d1f3572d9b6cbe37']);
            assert.deepEqual(tested.parents?.map(p=>p.sha), ['583105d0c548caf9c81228f0d1f3572d9b6cbe37',ci.head_sha]);
            assert.deepEqual(squash.parents?.map(p=>p.sha), ['583105d0c548caf9c81228f0d1f3572d9b6cbe37']);
            const failedCommit = await get('/git/commits/' + failedSHA);
            assert.equal(failedCommit.sha, failedSHA); assert.equal(failedCommit.tree?.sha, failedTree);
            const jobs = await get('/actions/runs/39814798811/attempts/1/jobs?per_page=100');
            assert.equal(jobs.total_count, 1); assert.equal(jobs.jobs?.length, 1);
            const job = jobs.jobs[0];
            assert.equal(job.id, 119950374894); assert.equal(job.name, 'deploy');
            assert.equal(job.run_id, 39814798811); assert.equal(job.run_attempt, 1);
            assert.equal(job.head_sha, failedSHA); assert.equal(job.status, 'completed');
            assert.equal(job.conclusion, 'failure');
            const steps = [
              ['Set up job', 'success'],
              ['Require separately armed release window', 'failure'],
              ['Verify approved CI and dispatch identity', 'skipped'],
              ['Check out reviewed release controller', 'skipped'],
              ['Check out approved application only', 'skipped'],
              ['Verify reviewed controller checkout', 'skipped'],
              ['Set up Node 24', 'skipped'],
              ['Verify source and locked tooling', 'skipped'],
              ['Validate and build complete application', 'skipped'],
              ['Record source and artifact provenance', 'skipped'],
              ['Preflight, one Wrangler deployment invocation, and read-only verification', 'skipped'],
              ['Retain credential-free release evidence', 'success'],
              ['Complete job', 'success']
            ];
            assert(Array.isArray(job.steps)); assert.equal(job.steps.length, steps.length);
            for (const [index, [name, conclusion]] of steps.entries()) {
              assert.equal(job.steps[index].number, index + 1);
              assert.equal(job.steps[index].name, name);
              assert.equal(job.steps[index].status, 'completed');
              assert.equal(job.steps[index].conclusion, conclusion, 'Historical execution evidence changed');
            }
            for (const id of [39814798811, currentID]) {
              const approvals = await get('/actions/runs/' + id + '/approvals');
              assert(Array.isArray(approvals) && approvals.length === 1, 'Unverifiable environment approval');
              const approval = approvals[0];
              assert.equal(approval.state, 'approved');
              assert.equal(approval.user?.login, owner); assert.equal(approval.user?.id, ownerID);
              assert.equal(approval.environments?.length, 1);
              const environment = approval.environments[0];
              assert.equal(environment.id, 24902198946); assert.equal(environment.name, 'classyline-production');
              assert.equal(environment.can_admins_bypass, false, 'Environment approval bypass permitted');
            }
            // Preserve exact original logs in Git, not an expiring Actions artifact. Live job
            // metadata remains mandatory: this archive never substitutes for missing history.
            const blobID = '071fce850fcf330ef2efd4c9e969793f67852872';
            const logSHA256 = 'b48a0342e34036759e3196050941baa2b39b9243b0db5ef80c62ebaace4dc54f';
            const blob = await get('/git/blobs/' + blobID);
            assert.equal(blob.sha, blobID); assert.equal(blob.encoding, 'base64');
            assert.equal(blob.size, 4574); assert.equal(typeof blob.content, 'string');
            assert(blob.content.length <= 6400, 'Oversized historical log encoding');
            const base64 = blob.content.replace(/\n/g, '');
            const bytes = Buffer.from(base64, 'base64');
            assert(bytes.toString('base64') === base64, 'Malformed historical log encoding');
            assert.equal(bytes.length, 4574);
            const {createHash: hash} = await import('node:crypto');
            assert.equal(hash('sha256').update(bytes).digest('hex'), logSHA256);
            assert.equal(hash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'), blobID);
            return {historical_run_ids: [39629341749, 39814798811, 39838839195], release_run_id: currentID,
              release_run_number: 1, release_attempt: 1, controller_sha: controller.sha,
              controller_tree: controller.tree.sha, failed_job_id: job.id,
              failed_deployment_step: 'skipped', original_log_blob: blobID, original_log_sha256: logSHA256,
              owner_environment_approval_verified: true, replay_permitted: false};
          }
          // END FIXED V21 GUARD
          await verifyV21(get);
          console.log('Approved candidate CI and Owner dispatch verified.');
          NODE

      - name: Check out reviewed release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Skyeagle123/Classyline
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Check out approved application only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed official commit
        with:
          repository: Skyeagle123/Classyline
          ref: 0ce95a706a88c63a914c25b142d4fc6878de66d8
          path: app
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify reviewed controller checkout
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C control status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'

      - name: Verify source and locked tooling
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0ce95a706a88c63a914c25b142d4fc6878de66d8
          test "$(git rev-parse 'HEAD^{tree}')" = 8266d7f79405fca39374298b4695687b225de4c7
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f package-lock.json
          for config in wrangler.toml wrangler.json wrangler.jsonc .env .env.local .dev.vars .npmrc; do
            test ! -e "$config"
          done
          npm ci --ignore-scripts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          assert.equal(process.versions.node, '24.19.0');
          const p = JSON.parse(readFileSync('package.json'));
          const w = JSON.parse(readFileSync('node_modules/wrangler/package.json'));
          assert.equal(p.devDependencies.wrangler, '4.150.0');
          assert.equal(w.version, '4.150.0');
          NODE

      - name: Validate and build complete application
        working-directory: app
        run: |
          set -euo pipefail
          npm test
          npm run security:check
          npm audit --audit-level=high
          npm run build
          npm run build:functions

      - name: Record source and artifact provenance
        working-directory: app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {lstatSync, readdirSync, readFileSync, mkdirSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const evidence = join(process.env.RUNNER_TEMP, 'classyline-evidence');
          mkdirSync(evidence, {recursive: true});
          assert.equal(execFileSync('git', ['status', '--porcelain=v1', '--untracked-files=all'],
            {encoding: 'utf8'}), '');
          const files = [];
          function collect(root, label) {
            for (const name of readdirSync(root).sort()) {
              const path = join(root, name), stat = lstatSync(path);
              assert(!stat.isSymbolicLink(), 'Symlink in build output');
              if (stat.isDirectory()) collect(path, `${label}/${name}`);
              else {
                assert(stat.isFile(), 'Unexpected build output type');
                files.push({path: `${label}/${name}`, bytes: stat.size,
                  sha256: createHash('sha256').update(readFileSync(path)).digest('hex')});
              }
            }
          }
          collect('dist', 'dist');
          collect('/tmp/classyline-functions-build', 'functions-build-check');
          const routes = JSON.parse(readFileSync('dist/_routes.json'));
          assert(routes.include.includes('/api/*'), 'Missing Functions routing');
          assert(lstatSync('functions/api/[[path]].js').isFile());
          assert(files.some(f => f.path.startsWith('functions-build-check/')), 'Missing Functions build');
          const tracked = execFileSync('git', ['ls-files', '-z'], {encoding: 'utf8'}).split('\0').filter(Boolean);
          for (const path of tracked) files.push({path: `source/${path}`,
            sha256: createHash('sha256').update(readFileSync(path)).digest('hex')});
          const control = join(process.env.GITHUB_WORKSPACE, 'control');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], {cwd: control, encoding: 'utf8'}).trim(), process.env.GITHUB_SHA);
          const controlFiles = execFileSync('git', ['ls-files', '-z'], {cwd: control, encoding: 'utf8'}).split('\0').filter(Boolean);
          for (const path of controlFiles) files.push({path: `control-source/${path}`,
            sha256: createHash('sha256').update(readFileSync(join(control, path))).digest('hex')});
          const provenance = {
            application_sha: '0ce95a706a88c63a914c25b142d4fc6878de66d8',
            application_tree: '8266d7f79405fca39374298b4695687b225de4c7',
            accepted_squash_main: '0ce95a706a88c63a914c25b142d4fc6878de66d8',
            ci_tested_checkout: '4f1770c12451aed3495f66e3990e399016249ada',
            workflow_sha: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version,
            wrangler: '4.150.0', approved_ci: 39851191294, files
          };
          writeFileSync(join(evidence, 'provenance.json'), JSON.stringify(provenance, null, 2));
          console.log(`Recorded ${files.length} source and build hashes. No credentials included.`);
          NODE

      - name: Preflight, one Wrangler deployment invocation, and read-only verification
        working-directory: app
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_ARMED: ${{ vars.CLASSYLINE_RELEASE_ARMED }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync, spawn} from 'node:child_process';
          import {existsSync, lstatSync, readdirSync, readFileSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const e = process.env;
          const candidate = '0ce95a706a88c63a914c25b142d4fc6878de66d8';
          const baseline = '9f36717b-a93f-410b-858a-4e9c0e4314fe';
          const baselineSHA = '45ac09182cca5cc989fbae1c967c6e7e849e63c3';
          const projectID = '25d5c0d3-f248-4d69-b5a3-feacfcb66dec';
          const root = '/accounts/4bfa1a9c849c3da50520f7a4bcccccab/pages/projects/classyline2';
          const evidence = join(e.RUNNER_TEMP, 'classyline-evidence');
          function save(name, data) {
            writeFileSync(join(evidence, name), JSON.stringify(data, null, 2));
          }
          function check(ok, message) { if (!ok) throw new Error(message); }
          // Source-review gate; the independent runtime release arm must also pass.
          const RELEASE_IMPLEMENTATION_REVIEWED = true;
          check(RELEASE_IMPLEMENTATION_REVIEWED, 'BLOCKED: Wrangler release implementation awaits independent review');
          check(e.RELEASE_ARMED === 'true', 'Release window is not armed');
          check(Boolean(e.CLOUDFLARE_API_TOKEN), 'Missing protected environment token; stop');
          assert.equal(e.CLOUDFLARE_ACCOUNT_ID, '4bfa1a9c849c3da50520f7a4bcccccab');
          // Read-only calls have bounded timeouts and no automatic retry. Never log bodies.
          async function cf(path) {
            const r = await fetch('https://api.cloudflare.com/client/v4' + path, {
              redirect: 'error', headers: {Authorization: `Bearer ${e.CLOUDFLARE_API_TOKEN}`},
              signal: AbortSignal.timeout(20000)});
            if (!r.ok) throw new Error(`Cloudflare read failed: HTTP ${r.status}`);
            const body = await r.json();
            check(body.success === true, 'Cloudflare read failed');
            return body;
          }
          async function recoveryGet(path) {
            const r = await fetch('https://api.github.com/repos/Skyeagle123/Classyline' + path, {
              redirect: 'error', headers: {Authorization: `Bearer ${e.GH_TOKEN}`,
                Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
              signal: AbortSignal.timeout(20000)});
            check(r.ok, `GitHub recovery read failed: HTTP ${r.status}`);
            return r.json();
          }
          // BEGIN FIXED V21 GUARD — identical at initial and final preflight.
          async function verifyV21(get) {
            const e = process.env;
            const path = '.github/workflows/classyline-production-v21.yml';
            const historicalPath = '.github/workflows/classyline-production-manual.yml';
